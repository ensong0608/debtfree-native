<style>
#bitless-quiet { --ink:light-dark(#113241,#eaf5f6); --muted:light-dark(#496575,#a9c3cb); --page:light-dark(#edf6f7,#10242f); --paper:light-dark(#fff,#16313f); --edge:light-dark(#cbdde2,#335263); --tint:light-dark(#dbf3f4,#19434a); --brand:light-dark(#056f83,#83e2ea); --solid:light-dark(#08788d,#87e6e9); --on:light-dark(#fff,#0a2630); font-family:system-ui,sans-serif; }
#bitless-quiet * { box-sizing:border-box; }
#bitless-quiet .views { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
#bitless-quiet figure { margin:0; min-width:0; display:flex; flex-direction:column; }
#bitless-quiet figcaption { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:0 2px 8px; color:var(--foreground); font-size:13px; font-weight:650; }
#bitless-quiet figcaption span { color:var(--muted-foreground); font-size:11px; font-weight:500; }
#bitless-quiet .sample { color:var(--muted-foreground); margin:0 2px 12px; font-size:12px; }
#bitless-quiet .phone { background:var(--page); color:var(--ink); border:1px solid var(--edge); border-radius:24px; overflow:hidden; display:flex; flex:1; flex-direction:column; position:relative; min-height:395px; font-variant-numeric:tabular-nums; }
#bitless-quiet .body { display:grid; gap:10px; padding:12px 13px; align-content:start; flex:1; }
#bitless-quiet .row { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
#bitless-quiet h3,#bitless-quiet h4,#bitless-quiet p { margin:0; }
#bitless-quiet h3 { font-size:21px; line-height:1.1; letter-spacing:-.55px; }
#bitless-quiet h4,#bitless-quiet strong { font-size:13px; font-weight:680; }
#bitless-quiet small,.bl-muted { font-size:11px; color:var(--muted); }
#bitless-quiet .panel { border:1px solid var(--edge); background:var(--paper); border-radius:15px; padding:10px 11px; }
#bitless-quiet .hero { background:linear-gradient(140deg,var(--paper),var(--tint)); }
#bitless-quiet .amount { display:block; color:var(--ink); font-size:32px; font-weight:730; letter-spacing:-1.3px; line-height:1.15; }
#bitless-quiet .ink-link { color:var(--brand); font-weight:680; }
#bitless-quiet button,#bitless-quiet input,#bitless-quiet select { font:inherit; color:inherit; }
#bitless-quiet button { background:none; border:0; padding:0; }
#bitless-quiet .call { background:var(--solid); color:var(--on); border-radius:10px; font-size:12px; font-weight:720; min-height:40px; padding:6px 12px; }
#bitless-quiet .link { font-size:12px; color:var(--brand); font-weight:690; min-height:36px; }
#bitless-quiet .hero .row { margin-top:2px; }
#bitless-quiet details > summary { list-style:none; font-size:12px; min-height:35px; position:relative; padding-right:17px; }
#bitless-quiet details > summary::-webkit-details-marker { display:none; }
#bitless-quiet details > summary::after { content:'›'; position:absolute; right:1px; top:50%; translate:0 -50%; font-size:19px; color:var(--brand); }
#bitless-quiet details[open] > summary::after { rotate:90deg; }
#bitless-quiet .divider { border-top:1px solid var(--edge); }
#bitless-quiet .line { min-height:29px; font-size:12px; }
#bitless-quiet .track { display:flex; height:6px; border-radius:8px; overflow:hidden; margin:8px 0 3px; background:var(--edge); }
#bitless-quiet .track i:nth-child(1) { background:#64a7e6; width:62%; }
#bitless-quiet .track i:nth-child(2) { background:#71cdb4; width:13%; }
#bitless-quiet .track i:nth-child(3) { background:#edab96; width:18%; }
#bitless-quiet .tabbar { color:var(--muted); padding:8px 4px 9px; border-top:1px solid var(--edge); background:var(--paper); display:flex; justify-content:space-around; gap:4px; font-size:10px; }
#bitless-quiet .tabbar span { text-align:center; display:grid; gap:2px; }
#bitless-quiet .tabbar b { font-size:16px; line-height:1; font-weight:500; }
#bitless-quiet .tabbar .active { color:var(--brand); font-weight:750; }
#bitless-quiet .seg { display:flex; gap:12px; font-size:12px; padding-bottom:6px; border-bottom:1px solid var(--edge); }
#bitless-quiet .sheet { display:grid; gap:8px; padding:12px 13px; background:var(--paper); border:1px solid var(--edge); border-radius:19px 19px 0 0; margin-top:auto; }
#bitless-quiet .grab { width:26px; height:3px; border-radius:4px; background:var(--edge); margin:0 auto; }
#bitless-quiet .switch { display:flex; background:var(--page); border-radius:10px; padding:3px; }
#bitless-quiet .switch button { flex:1; min-height:34px; border-radius:8px; font-size:12px; }
#bitless-quiet .switch button[aria-pressed=true] { background:var(--tint); color:var(--brand); font-weight:700; }
#bitless-quiet .result { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px 0; border-block:1px solid var(--edge); }
#bitless-quiet .result strong { display:block; font-size:16px; }
#bitless-quiet .entry { display:grid; gap:7px; }
#bitless-quiet .entry label { display:grid; gap:2px; font-size:11px; color:var(--muted); min-width:0; }
#bitless-quiet .entry input,#bitless-quiet .entry select { width:100%; min-width:0; border:1px solid var(--edge); border-radius:8px; padding:6px 7px; background:var(--paper); color:var(--ink); font-size:12px; min-height:34px; }
#bitless-quiet .entry .money { font-size:24px; background:var(--tint); font-weight:700; }
#bitless-quiet .entry .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
#bitless-quiet .delta { color:var(--brand); font-size:21px; font-weight:730; letter-spacing:-.5px; }
#bitless-quiet .status { font-size:11px; color:var(--brand); }
#bitless-quiet .status:empty { display:none; }
@media(max-width:560px) { #bitless-quiet .views { grid-template-columns:1fr; } }
@media(pointer:coarse) { #bitless-quiet .call,#bitless-quiet .link,#bitless-quiet .switch button,#bitless-quiet details > summary { min-height:44px; } }
</style>
<div id="bitless-quiet">
  <p class="sample">Proposed screens · Sample amounts</p>
  <div class="views">

      </section>
    </figure>
    <figure>
      <figcaption>Payoff preview <span>Opens from Budget or Strategy</span></figcaption>
      <section class="phone" aria-label="Payoff preview mockup">
        <div class="body"><h3>Debt</h3><div class="seg"><span class="bl-muted">Accounts</span><strong class="ink-link">Strategy</strong></div>
          <div class="panel hero row"><span><small>Current payoff estimate</small><strong style="display:block">March 2028</strong></span><small>Avalanche</small></div>
        </div>
        <div class="sheet">
          <div class="grab" aria-hidden="true"></div><h4>Preview extra payment</h4>
          <div class="switch" role="group" aria-label="Extra payment frequency"><button type="button" class="cursor-interaction" data-mode="once" aria-pressed="true">One time</button><button type="button" class="cursor-interaction" data-mode="monthly" aria-pressed="false">Monthly</button></div>
          <div class="row line"><strong data-extra>$320</strong><small>Next target · Travel Card</small></div>
          <div class="result" aria-live="polite"><div><small>Estimated payoff</small><strong data-date>February 2028</strong></div><div><small>Interest saved</small><strong data-savings>$84</strong></div></div>
          <small>Compared with your current plan</small>
        </div>
        <div class="tabbar" aria-label="App tabs"><span><b>⌂</b>Home</span><span class="active" aria-current="page"><b>▤</b>Debt</span><span><b>⇄</b>Transactions</span><span><b>◫</b>Budget</span><span><b>▥</b>Progress</span></div>

      </section>
    </figure>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('bitless-quiet');
  const modes = [...root.querySelectorAll('[data-mode]')];
  root.querySelector('[data-preview]').addEventListener('click', () => modes[0].focus());
  for (const button of modes) button.addEventListener('click', () => {
    const monthly = button.dataset.mode === 'monthly';
    for (const mode of modes) mode.setAttribute('aria-pressed', String(mode === button));
    root.querySelector('[data-extra]').textContent = monthly ? '$320 / month' : '$320';
    root.querySelector('[data-date]').textContent = monthly ? 'September 2027' : 'February 2028';
    root.querySelector('[data-savings]').textContent = monthly ? '$510' : '$84';
  });
  const form = root.querySelector('form');
  root.querySelector('[data-repeat]').addEventListener('click', () => {
    form.elements.payee.value = 'Corner Market';
    form.elements.category.value = 'Groceries';
    form.elements.account.value = 'Everyday Card';
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    form.querySelector('[role=status]').textContent = 'Demo only · No purchase recorded';
  });
})();
</script>
