<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation and refresh design study</title>
<style>
html,body,#root{margin:0;background:transparent;color:var(--foreground,#25242b);font:14px system-ui,sans-serif}*{box-sizing:border-box}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e3a93c;outline-offset:2px}.review{max-width:480px;margin:auto;padding:12px 0}.review h1{font-size:18px;margin:0 0 4px}.review p{color:var(--muted-foreground,#686773);margin:0 0 12px}.controls [hidden]{display:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.controls button,.controls select{min-height:40px;border:1px solid var(--border,#ccc);border-radius:10px;background:var(--background,#fff);color:var(--foreground,#25242b);padding:0 10px}
.phone{--canvas:#F6F5F2;--surface:#fff;--raised:#F0EFF4;--border:#E2DFE8;--text:#24232D;--muted:#676471;--brand:#5147A8;--onbrand:#fff;--hero:#282443;--onhero:#FAF8FF;--tint:#EEEBF8;position:relative;width:min(100%,400px);height:720px;min-height:560px;margin:auto;overflow:hidden;border:1px solid var(--border);border-radius:32px;background:var(--canvas);color:var(--text);box-shadow:0 18px 50px #0002}.phone.dark{--canvas:#141318;--surface:#1D1C23;--raised:#28262F;--border:#37333F;--text:#F3F1F7;--muted:#B1ABB9;--brand:#B9B1FF;--onbrand:#211D39;--hero:#312B56;--onhero:#FAF8FF;--tint:#2C2840}.phone.cobalt{--canvas:#F3F5F8;--surface:#fff;--raised:#EDF0F5;--border:#DCE2EB;--text:#1C293C;--muted:#5F6C7E;--brand:#245ED0;--onbrand:#fff;--hero:#172F5A;--onhero:#F4F8FF;--tint:#EAF0FC}.phone.cobalt.dark{--canvas:#12151B;--surface:#1B2029;--raised:#272E39;--border:#343D4C;--text:#F0F4FA;--muted:#A9B4C4;--brand:#94B7FF;--onbrand:#132344;--hero:#20395F;--onhero:#F4F8FF;--tint:#253146}
.header{height:76px;background:var(--canvas);display:flex;align-items:center;justify-content:space-between;padding:20px 24px 8px}.header strong{font-size:22px;letter-spacing:-.04em}.avatar{background:var(--tint);color:var(--brand);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700}.scroll{height:calc(100% - 76px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px 16px 165px}.rail{padding:0 12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}.hero{background:var(--hero);color:var(--onhero);border-radius:22px;padding:22px;margin:8px 0 16px}.hero .eyebrow{color:inherit;opacity:.7}.hero h2{font-size:32px;letter-spacing:-.04em;margin:8px 0 4px}.cents{font-size:.55em}.hero p{margin:0;color:var(--onhero);opacity:.85;font-size:12px}.sections{display:flex;flex-wrap:wrap;gap:18px;border-bottom:1px solid var(--border);margin:0 12px 18px}.sections button{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:12px 0;font-weight:650;min-height:44px}.sections button.active{color:var(--brand);border-color:var(--brand)}.titleline{display:flex;align-items:center;justify-content:space-between;margin:0 12px 10px}.titleline h3{font-size:16px;margin:0}.sub{color:var(--muted);font-size:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 16px;margin-bottom:16px}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);min-height:68px}.row:last-child{border:0}.mark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-weight:700}.row .name{flex:1;min-width:0;font-weight:650}.row small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.amount{max-width:48%;overflow-wrap:anywhere;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.footer{position:absolute;bottom:0;left:0;right:0;padding:0 12px 12px;background:linear-gradient(transparent,var(--canvas) 26%)}.action[hidden]{display:none}.action{display:block;margin:0 auto 8px;min-height:44px;padding:0 20px;border:1px solid var(--border);border-radius:24px;background:var(--surface);color:var(--brand);font-weight:700;box-shadow:0 5px 18px #0002}.dock{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:32px;box-shadow:0 8px 25px #0002}.dock button{min-width:44px;height:52px;border:0;border-radius:28px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px}.dock button.active{background:var(--text);color:var(--canvas);font-weight:700}.icon{font-size:28px;line-height:1;width:30px;height:30px;display:grid;place-items:center}.icon svg{width:28px;height:28px}.dock .label{display:none}.dock .active .label{display:inline}.refresh{height:24px;text-align:center;color:var(--brand);font-size:12px;font-weight:650}.overlay{position:absolute;inset:0;background:#0008;display:flex;align-items:end}.overlay[hidden]{display:none}.sheet{width:100%;border-radius:24px 24px 0 0;background:var(--surface);padding:24px;color:var(--text)}.sheet h2{margin:0 0 8px}.sheet p{color:var(--muted)}.sheet input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--canvas);color:var(--text)}.sheet button{margin-top:14px;min-height:44px;border:0;border-radius:12px;padding:0 20px;background:var(--brand);color:var(--onbrand)}
@container (max-width: 380px){.dock button{flex:1;min-width:44px;height:52px;padding:0}.dock .label,.dock .active .label{display:none}.phone .compact-caption{display:block}}.compact-caption{display:none;text-align:center;font-size:12px;font-weight:600;color:var(--text);padding-top:6px}.phone{container-type:inline-size}
i[data-lucide]{display:block;position:relative;font-style:normal;color:currentColor;box-sizing:border-box}
i[data-lucide="house"]{width:21px;height:19px;border:2px solid currentColor;border-top:0;border-radius:2px;margin-top:7px}
i[data-lucide="house"]:before{content:"";position:absolute;width:17px;height:17px;left:0;top:-9px;border-left:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);border-radius:2px}
i[data-lucide="house"]:after{content:"";position:absolute;width:6px;height:10px;border:2px solid currentColor;border-bottom:0;bottom:0;left:5px}
i[data-lucide="wallet-cards"]{width:28px;height:21px;border:2px solid currentColor;border-radius:5px}
i[data-lucide="wallet-cards"]:before{content:"";position:absolute;left:0;right:0;top:4px;border-top:3px solid currentColor}
i[data-lucide="wallet-cards"]:after{content:"";position:absolute;left:4px;bottom:4px;width:7px;border-top:2px solid currentColor}
i[data-lucide="arrow-left-right"]{width:26px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
i[data-lucide="arrow-left-right"]:before{content:"";position:absolute;right:0;top:-5px;width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
i[data-lucide="arrow-left-right"]:after{content:"";position:absolute;left:0;bottom:-5px;width:7px;height:7px;border-bottom:2px solid currentColor;border-left:2px solid currentColor;transform:rotate(45deg)}
i[data-lucide="layout-dashboard"]{width:24px;height:26px;border:2px solid currentColor;border-radius:4px}
i[data-lucide="layout-dashboard"]:before{content:"";position:absolute;top:0;bottom:0;left:8px;border-left:2px solid currentColor}
i[data-lucide="layout-dashboard"]:after{content:"";position:absolute;top:9px;left:8px;right:0;border-top:2px solid currentColor}
i[data-lucide="chart-no-axes-column"]{width:27px;height:28px;background:linear-gradient(currentColor,currentColor) 1px 17px/5px 11px no-repeat,linear-gradient(currentColor,currentColor) 11px 9px/5px 19px no-repeat,linear-gradient(currentColor,currentColor) 21px 1px/5px 27px no-repeat}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div id="root"><main class="review"><h1>Navigation & refresh · design study</h1><p>Synthetic examples only. Choose a tab, scroll the account list, or pull down from its top.</p><div class="controls"><label>Theme <select id="theme"><option>Light</option><option selected>Dark</option></select></label><label>Accent <select id="accent"><option>Indigo</option><option>Cobalt</option></select></label><button id="refreshButton">Preview refresh</button><button id="offlineButton">Preview offline</button><button id="reconnectButton" hidden>Reconnect demo</button></div>
<div class="phone dark" id="phone"><header class="header"><strong id="heading">Debt</strong><span class="avatar" aria-label="Synthetic profile Alex">A</span></header><div class="scroll" id="scroll"><div id="refreshStatus" class="refresh" role="status" aria-live="polite">Pull down to refresh</div><div id="pages"></div></div><div class="footer"><button class="action" id="action">＋ &nbsp; Add Debt Account</button><nav class="dock" aria-label="Main navigation" id="dock"></nav><div class="compact-caption" id="compactCaption" aria-hidden="true">Debt</div></div><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle"></h2><p>Demo preview only. Nothing will be submitted.</p><label>Example name <input placeholder="Optional draft" id="draft"></label><p id="draftStatus" role="status" aria-live="polite">Draft stays here during a data refresh.</p><button id="sheetRefresh">Preview data refresh</button> <button id="close">Close preview</button></section></div></div></main></div>
<script>
const tabs=['Home','Debt','Transactions','Budget','Progress'],icons=['house','wallet-cards','arrow-left-right','layout-dashboard','chart-no-axes-column'],fallback=['⌂','▣','⇄','▦','▥'],actions={Debt:'Add Debt Account',Transactions:'Add Transactions',Budget:'Add Monthly Expense'};let current='Debt',section={Debt:'Accounts',Transactions:'History',Progress:'Overview'},period='Current month',offline=false,timer;const phone=document.querySelector('#phone'),scroll=document.querySelector('#scroll'),pages=document.querySelector('#pages'),dock=document.querySelector('#dock'),status=document.querySelector('#refreshStatus'),overlay=document.querySelector('#overlay');
const names=['Everyday Card','Travel Card','Personal Loan','Store Card','Education Loan','Rewards Card','Credit Line','Furniture Loan','Family Car Loan','Home Project Loan'];
function row(name,detail,value,i=0){return `<div class="row"><span class="mark" aria-hidden="true">${i%2?'◇':'▣'}</span><span class="name">${name}<small>${detail}</small></span><span class="amount">${value}</span></div>`}function hero(label,value,detail){return `<div class="hero"><div class="eyebrow">${label}</div><h2>${value}<span class="cents">.00</span></h2><p>${detail}</p></div>`}function segments(tab,items){return `<div class="sections" aria-label="${tab} sections">${items.map(x=>`<button class="${section[tab]===x?'active':''}" data-section="${x}" ${section[tab]===x?'aria-current="page"':''}>${x}</button>`).join('')}</div>`}function card(title,rows){return `<div class="titleline"><h3>${title}</h3></div><div class="card">${rows}</div>`}
function render(){document.querySelector('#compactCaption').textContent=current;document.querySelector('#heading').textContent=current==='Home'?'Hi, Alex':current;document.querySelector('#action').hidden=!actions[current];document.querySelector('#action').textContent='＋  '+(actions[current]||'');dock.innerHTML=tabs.map((t,i)=>`<button aria-label="${t}" ${current===t?'aria-current="page"':''} class="${current===t?'active':''}" data-tab="${t}"><span class="icon" aria-hidden="true"><i data-lucide="${icons[i]}"></i></span><span class="label">${t}</span></button>`).join('');let html='';if(current==='Debt'){html=hero('Total balance','$53,200','10 accounts · illustrative balances')+segments('Debt',['Accounts','Strategy'])+(section.Debt==='Accounts'?card('Accounts',names.map((n,i)=>row(n,'Example account',`$${(8200-i*640).toLocaleString()}.00`,i)).join('')):card('Payoff strategy',row('Everyday Card','Monthly projection','$8,200.00')))}if(current==='Home')html=hero('Your accounts','$53,200','Cards & Loans · balance change vs entered original −$3,240.00')+card('Your accounts',row('Cards & Loans','Synthetic example','$53,200.00'))+card('Payoff strategy',row('Your plan','View in Debt → Strategy','›'));if(current==='Transactions')html=segments('Transactions',['History','Upcoming','Scheduled'])+card(section.Transactions, row('Example transaction','Nov 8 · synthetic','−$125.00')+row('Example entry','Nov 5 · synthetic','−$40.00',1));if(current==='Budget')html=hero('Monthly income','$5,200','Synthetic monthly example')+card('Monthly expenses',row('Housing','Monthly budget','$1,500.00')+row('Groceries','Monthly budget','$450.00',1));if(current==='Progress'){
html=segments('Progress',['Overview','Utilization','Milestones']);
if(section.Progress==='Overview'){
const activity=period==='Current month'?[['3 entries','−$120.00'],['1 entry','+$20.00']]:period==='Previous month'?[['2 entries','−$80.00'],['0 entries','$0.00']]:[['5 entries','−$200.00'],['1 entry','+$20.00']];
html+=hero('Adjusted-reference reduction','$3,240','Based on entered references')+`<div class="titleline"><h3>Recorded activity</h3><select id="periodSelect" aria-label="Activity period" style="max-width:55%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)">${['Current month','Previous month','Lifetime'].map(p=>`<option ${period===p?'selected':''}>${p}</option>`).join('')}</select></div>`+card('Activity by account',row('Everyday Card',activity[0][0],activity[0][1])+row('Personal Loan',activity[1][0],activity[1][1],1));
}else if(section.Progress==='Utilization') html=hero('Used credit','$8,200','Of $20,000 tracked limit · 41% used')+card('Cards to review',row('Everyday Card','30% target · Watch','$8,200.00'));
else html=card('Payoff milestones',row('First account paid off','Locked · complete history needed','○')+row('Debt-free','Locked · complete history needed','○',1));
}pages.innerHTML=html; if(globalThis.lucide)globalThis.lucide.createIcons();}
dock.onclick=e=>{let b=e.target.closest('[data-tab]');if(b){current=b.dataset.tab;scroll.scrollTop=0;render();dock.querySelector('[aria-current]').focus({preventScroll:true})}};pages.onclick=e=>{let b=e.target.closest('[data-section]');if(b){section[current]=b.dataset.section;render();pages.querySelector('[data-section][aria-current]').focus({preventScroll:true})}};document.querySelector('#theme').onchange=e=>phone.classList.toggle('dark',e.target.value==='Dark');document.querySelector('#accent').onchange=e=>phone.classList.toggle('cobalt',e.target.value==='Cobalt');document.querySelector('#action').onclick=()=>{document.querySelector('#sheetTitle').textContent=actions[current];overlay.hidden=false;document.querySelector('#draft').focus()};document.querySelector('#close').onclick=()=>{overlay.hidden=true;document.querySelector('#action').focus()};function refresh(fail=offline){clearTimeout(timer);status.textContent='Refreshing…';timer=setTimeout(()=>status.textContent=fail?'Offline · saved data shown':'Updated just now',900)}document.querySelector('#refreshButton').onclick=()=>refresh();document.querySelector('#offlineButton').onclick=()=>{offline=true;document.querySelector('#reconnectButton').hidden=false;refresh();};let start=null;scroll.addEventListener('pointerdown',e=>{if(scroll.scrollTop<=0)start={x:e.clientX,y:e.clientY}});scroll.addEventListener('pointerup',e=>{if(start){let dx=e.clientX-start.x,dy=e.clientY-start.y;if(dy>70&&dy>Math.abs(dx)*1.5&&scroll.scrollTop<=0)refresh();start=null}});scroll.addEventListener('pointercancel',()=>start=null);render();

const root=document.getElementById('root'),q=selector=>root.querySelector(selector);
const backgrounds=[q('.header'),scroll,q('.footer'),q('.controls')];
q('#action').onclick=()=>{q('#sheetTitle').textContent=actions[current];overlay.hidden=false;backgrounds.forEach(el=>el.inert=true);q('#draft').focus();};
function closeSheet(){overlay.hidden=true;backgrounds.forEach(el=>el.inert=false);q('#action').focus();}
q('#close').onclick=closeSheet;
overlay.onclick=e=>{if(e.target===overlay)closeSheet();};
root.addEventListener('keydown',e=>{
if(overlay.hidden)return;
if(e.key==='Escape'){e.preventDefault();closeSheet();return;}
if(e.key!=='Tab')return;
const controls=[...overlay.querySelectorAll('input,button')],first=controls[0],last=controls[controls.length-1];
if(!overlay.contains(document.activeElement)){e.preventDefault();(e.shiftKey?last:first).focus();}
else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
pages.onchange=e=>{if(e.target.id==='periodSelect'){period=e.target.value;render();q('#periodSelect').focus({preventScroll:true});}};
q('#reconnectButton').onclick=()=>{offline=false;q('#reconnectButton').hidden=true;refresh();};
q('#sheetRefresh').onclick=()=>{refresh();q('#draftStatus').textContent=offline?'Offline. Saved data and your draft are retained.':'Refreshing data. Your draft is retained.';};

let touchStart=null,touchDistance=0;
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop<=0&&overlay.hidden&&!e.target.closest('button,select,input')){const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};touchDistance=0;}},{passive:true});
scroll.addEventListener('touchmove',e=>{if(!touchStart)return;const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchDistance=dy>Math.abs(dx)*1.5?dy:0;if(touchDistance>12&&scroll.scrollTop<=0)e.preventDefault();},{passive:false});
scroll.addEventListener('touchend',()=>{if(touchStart&&touchDistance>70&&scroll.scrollTop<=0)refresh();touchStart=null;touchDistance=0;});
scroll.addEventListener('touchcancel',()=>{touchStart=null;touchDistance=0;});
</script></body></html>
