  {name:'Chase Prime',apr:'23.49',amount:'6,888',cents:'92',reduction:'2.1',date:'Aug 2027'},
  {name:'Discover',apr:'26.74',amount:'1,953',cents:'64',date:'Dec 2026'},
  {name:'USBConnect',apr:'0.00',amount:'2,540',cents:'02',date:'Jan 2027'}
 ];
 const icon='<span class="card-icon" aria-hidden="true"><i class="card-symbol"></i></span>';
 const accountRow=a=>`<div class="debt-card"><div class="account-main">${icon}<div class="account-name"><strong>${a.name}</strong><span>Credit card · ${a.apr}% APR</span></div><div class="account-value">$${a.amount}<small>.${a.cents}</small></div><span class="chevron" aria-hidden="true">›</span></div>${a.reduction?`<div class="mini-track" aria-label="${a.reduction}% adjusted-reference reduction"><i style="width:${a.reduction}%"></i></div>`:''}<div class="account-meta">${a.reduction?`<span class="reduction">↓ ${a.reduction}% reduced</span>`:'<span>Estimated payoff</span>'}<span>${a.reduction?'Est. ':''}${a.date}</span></div></div>`;
 const payoffRow=(a,i)=>`<div class="payoff-row"><span class="rank">${i+1}</span>${icon}<div class="account-name"><strong>${a.name}</strong><span>${a.apr}% APR</span></div><div class="account-value">$${a.amount}<small>.${a.cents}</small><span class="payoff-date">${a.date}</span></div></div>`;
 const methods=`<div class="method-panel"><div class="methods"><div class="method-option selected"><strong>Snowball<span class="radio" aria-hidden="true"></span></strong><span>Smallest balance first</span></div><div class="method-option"><strong>Avalanche<span class="radio" aria-hidden="true"></span></strong><span>Highest APR first</span></div></div></div>`;
 function render(){
  phone.className='phone '+direction; phone.dataset.page=page;
  root.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===direction)));
  root.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===page)));
  content.setAttribute('aria-labelledby',page==='accounts'?'account-design-tab':'strategy-design-tab');
  if(page==='accounts') content.innerHTML=`<div class="accounts-view"><div class="hero"><div class="hero-label"><span>Total balance</span><span class="info" aria-label="Balance information">ⓘ</span></div><div class="money">$375,913<small>.32</small></div><div class="hero-foot"><span>11 active accounts</span><span>All accounts</span></div></div><div class="filters" aria-label="Category filter preview"><span class="active">All (11)</span><span>Cards &amp; Loans</span><span>Home &amp; Auto</span></div><div class="toolbar"><span class="search"><i class="search-mark" aria-hidden="true"></i>Search accounts</span><span class="sort">Name<b>⌄</b></span></div><div class="section-title">Cards &amp; Loans<span class="group-total">$44,108<small>.71</small></span></div><div class="reference-caption">Reduction vs adjusted reference</div><div class="account-group">${accounts.map(accountRow).join('')}</div></div>`;
  else content.innerHTML=`<div class="strategy-view"><div class="hero"><div class="hero-label"><span>Estimated payoff</span><span class="info" aria-label="Estimate information">ⓘ</span></div><div class="hero-date">Dec 2027</div><div class="hero-foot"><span class="hero-months">13 months</span><span class="hero-method">Snowball</span></div><div class="hero-scope">Cards / Loans &amp; Auto · excludes mortgage</div></div><div class="scope-tabs" aria-label="Strategy scope preview"><span class="active">Debt strategy</span><span>Mortgage strategy</span></div><div class="section-title">Your method</div>${methods}<div class="extra-panel"><div class="extra-label">Extra monthly payment<span class="info">ⓘ</span></div><div class="extra-field"><span class="money">$3,500<small>.00</small></span><span>/ month</span></div></div><div class="section-title">Payoff order<span>Estimated</span></div><div class="payoff-list">${[accounts[2],accounts[3]].map(payoffRow).join('')}</div><div class="row-hint">Tap an account for its monthly projection</div></div>`;
 }
 root.querySelectorAll('[data-design]').forEach(b=>b.addEventListener('click',()=>{direction=b.dataset.design;render()}));
 root.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.section;render()}));
 render();
})();
</script>
</body></html>
