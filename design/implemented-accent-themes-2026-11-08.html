caption></figure><figure><img src="C:/Users/lawre/OneDrive/Desktop/DF_App_Development/debtfree-native/docs/acceptance/2026-11-08/accent-themes/cobalt-dark-debt.png" alt="Native Android cobalt dark-debt"><figcaption>Cobalt / dark / debt</figcaption></figure></section><section data-screen="light-income" hidden><figure><img src="C:/Users/lawre/OneDrive/Desktop/DF_App_Development/debtfree-native/docs/acceptance/2026-11-08/accent-themes/indigo-light-income.png" alt="Native Android indigo light-income"><figcaption>Indigo / light / income</figcaption></figure><figure><img src="C:/Users/lawre/OneDrive/Desktop/DF_App_Development/debtfree-native/docs/acceptance/2026-11-08/accent-themes/cobalt-light-income.png" alt="Native Android cobalt light-income"><figcaption>Cobalt / light / income</figcaption></figure></section><section data-screen="dark-income" hidden><figure><img src="C:/Users/lawre/OneDrive/Desktop/DF_App_Development/debtfree-native/docs/acceptance/2026-11-08/accent-themes/indigo-dark-income.png" alt="Native Android indigo dark-income"><figcaption>Indigo / dark / income</figcaption></figure><figure><img src="C:/Users/lawre/OneDrive/Desktop/DF_App_Development/debtfree-native/docs/acceptance/2026-11-08/accent-themes/cobalt-dark-income.png" alt="Native Android cobalt dark-income"><figcaption>Cobalt / dark / income</figcaption></figure></section><p>Actual Android captures. Income forms were opened without saving. Cobalt Dark Debt precedes the final shortened payoff labels.</p><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.querySelectorAll("section").forEach(s=>s.hidden=s.dataset.screen!==b.dataset.key)})</script></body></html>
