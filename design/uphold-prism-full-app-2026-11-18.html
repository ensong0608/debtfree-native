<style>
#bitless-full-study{font-family:'Proxima Nova','Montserrat',Arial,sans-serif;color:var(--foreground)}
#bitless-full-study *{box-sizing:border-box}
#bitless-full-study [hidden]{display:none!important}
#bitless-full-study button{font-family:inherit;cursor:pointer}

/* Review bar controls (hidden inside gallery-shell preview iframe) */
#bitless-full-study .design-picker,
#bitless-full-study .screen-picker{
  display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 auto 10px;max-width:740px;
}
#bitless-full-study .design-picker button,
#bitless-full-study .screen-picker button{
  font:600 12px/1.2 'Montserrat',Arial,sans-serif;
  border:1px solid var(--border,#d8e0ec);
  background:var(--card,#ffffff);
  color:var(--foreground,#0A0E17);
  border-radius:999px;
  padding:8px 14px;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .12s ease;
}
#bitless-full-study .design-picker button:hover,
#bitless-full-study .screen-picker button:hover{transform:translateY(-1px)}
#bitless-full-study .design-picker button[aria-pressed=true],
#bitless-full-study .screen-picker button[aria-pressed=true]{
  background:#00B386;border-color:#00B386;color:#071311;font-weight:700;
}

/* Stage & Phone Shell */
#bitless-full-study .stage{max-width:430px;margin:0 auto;container-type:inline-size}
#bitless-full-study .phone{
  height:203.87cqw;
  position:relative;
  border-radius:6.4cqw;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  line-height:1.25;
  box-shadow:0 20px 54px rgba(10,14,23,.18),0 2px 10px rgba(10,14,23,.08);
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font-family:'Proxima Nova','Montserrat',sans-serif;
}
#bitless-full-study .phone *,
#bitless-full-study .phone button{
  font-family:'Proxima Nova','Montserrat',sans-serif!important;
}

   Primary 3: Ember Coral  (#FF4D5E Light / #FF6B78 Dark) + Amber Watch

  /* Uphold-style Base Black Hero Contrast on Light Paper */
  --hero-bg:linear-gradient(135deg,#0A0E17 0%,#121B2E 58%,#0C2626 100%);
  --hero-ink:#F5F8FC;
  --hero-sub:#9BA9BE;
  --hero-border:rgba(255,255,255,.1);
  --hero-pill-bg:rgba(0,179,134,.18);
  --hero-pill-border:rgba(34,243,186,.35);
  --hero-pill-ink:#5CFAD0;
  --hero-track:rgba(255,255,255,.14);
  --hero-fill:#22F3BA;

  --selection:#E4F7F1;
  --selection-ink:#008B68;
  --pill-bg:#FFFFFF;
  --pill-ink:#0A0E17;
  --nav-bg:rgba(255,255,255,.96);
  --grid-dot:rgba(10,14,23,.06);
}

#bitless-full-study .phone.prism-carbon{
  --paper:#070B12;
  --surface:#101724;
  --surface-2:#172133;
  --ink:#F4F7FC;
  --muted-ink:#94A3B8;
  --line:#222E42;

  --p1:#22F3BA;
  --p1-ink:#22F3BA;
  --p1-on:#061410;
  --p1-soft:#0E2B25;

  --p2:#6E8FFF;
  --p2-ink:#89A5FF;
  --p2-soft:#172347;

  --p3:#FF6B78;
  --p3-ink:#FF6B78;
  --p3-soft:#31181F;

  --warn:#FBBF24;
  --warn-soft:#2D2412;
  --purp:#A78BFA;
  --purp-soft:#231D3D;

  --hero-bg:linear-gradient(135deg,#0D1526 0%,#112236 55%,#0C2D2B 100%);
  --hero-ink:#F4F7FC;
  --hero-sub:#9CB0C9;
  --hero-border:rgba(34,243,186,.22);
  --hero-pill-bg:rgba(34,243,186,.14);
  --hero-pill-border:rgba(34,243,186,.38);
  --hero-pill-ink:#22F3BA;
  --hero-track:rgba(255,255,255,.14);
  --hero-fill:#22F3BA;

  --selection:#112E28;
  --selection-ink:#22F3BA;
  --pill-bg:#141E2E;
  --pill-ink:#F4F7FC;
  --nav-bg:rgba(12,18,29,.96);
  --grid-dot:rgba(244,247,252,.06);
}

/* Status bar */
#bitless-full-study .statusbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.3cqw 4.8cqw .4cqw;font-size:2.6cqw;font-weight:600;color:var(--ink);
  flex-shrink:0;background:var(--paper);
}
#bitless-full-study .status-icons{display:flex;align-items:center;gap:1.4cqw;color:var(--ink)}

/* Header Chrome (Compact, Clear Space around Ascent Mark) */
#bitless-full-study .chrome{
  display:flex;align-items:center;justify-content:space-between;
  padding:.9cqw 4.4cqw 1.1cqw;flex-shrink:0;background:var(--paper);
}
#bitless-full-study .brand{
  display:flex;align-items:center;gap:2.2cqw;
  font-size:4.4cqw;font-weight:700;letter-spacing:-.12cqw;color:var(--ink);
}
#bitless-full-study .logo-mark{
  width:5.4cqw;height:5.4cqw;flex-shrink:0;display:block;
}
#bitless-full-study .chrome-right{display:flex;align-items:center;gap:1.8cqw}
#bitless-full-study .mode-chip{
  display:inline-flex;align-items:center;gap:1.1cqw;
  padding:1cqw 2.2cqw;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:2.4cqw;font-weight:600;color:var(--muted-ink);
}
#bitless-full-study .mode-chip i{
  width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--p1);display:block;
}
#bitless-full-study .gear-btn{
  width:7cqw;height:7cqw;border-radius:2.4cqw;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;padding:0;transition:border-color .15s ease;
}
#bitless-full-study .gear-btn:hover{border-color:var(--p1)}
#bitless-full-study .gear-btn svg{width:3.6cqw;height:3.6cqw}

/* Settings Header */
#bitless-full-study .settings-chrome{
  display:grid;grid-template-columns:7cqw 1fr 7cqw;align-items:center;
  padding:1cqw 4.4cqw 1.2cqw;flex-shrink:0;background:var(--paper);
  border-bottom:1px solid var(--line);
}
#bitless-full-study .settings-chrome h2{
  margin:0;text-align:center;font-size:4.1cqw;font-weight:700;color:var(--ink);letter-spacing:-.08cqw;
}
#bitless-full-study .close-btn{
  grid-column:3;width:7cqw;height:7cqw;border-radius:2.4cqw;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;padding:0;font-size:3.5cqw;font-weight:600;line-height:1;
}

/* Segmented Section Tabs (Pill-Track Architectural Switcher) */
#bitless-full-study .sections-wrap{
  padding:.6cqw 4.4cqw 1.4cqw;background:var(--paper);flex-shrink:0;
}
#bitless-full-study .sections{
  display:flex;gap:1cqw;padding:.9cqw;border-radius:3cqw;
  background:var(--surface-2);border:1px solid var(--line);
}
#bitless-full-study .sections button{
  flex:1;border:0;border-radius:2.2cqw;
  padding:1.5cqw 1cqw;background:transparent;color:var(--muted-ink);
  font-size:3.1cqw;font-weight:600;transition:all .16s ease;
}
#bitless-full-study .sections button[aria-selected=true]{
  background:var(--surface);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(10,14,23,.08);
}
#bitless-full-study .prism-carbon .sections button[aria-selected=true]{
  background:var(--p1);color:var(--p1-on);
}

/* Scrollable Content Area */
#bitless-full-study .content{
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
  padding:1.2cqw 4.4cqw 19cqw;
}
#bitless-full-study .content::-webkit-scrollbar{display:none}
#bitless-full-study .phone[data-page=settings] .content{padding-bottom:8cqw}

/* Kinetic Entrance Animation */
@keyframes riseIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
#bitless-full-study .anim-in{animation:riseIn .28s cubic-bezier(.2,.8,.2,1) both}

/* Currency & Numeric Typography */
#bitless-full-study .money-pair{
  display:inline-flex;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums;
}
#bitless-full-study .currency-symbol{
  font-size:.7em;font-weight:600;letter-spacing:0;margin-right:.12em;opacity:.84;
}
#bitless-full-study .currency-value{display:inline-block}
#bitless-full-study .money-pair small{display:inline!important;font-size:.62em;letter-spacing:0;font-weight:600;color:inherit;margin:0}
#bitless-full-study .tabular{font-variant-numeric:tabular-nums}

/* Shared Architectural Cards & Grid Rhythm */
#bitless-full-study .card{
  background:var(--surface);border:1px solid var(--line);border-radius:4.2cqw;
  padding:3.8cqw 4cqw;margin-bottom:2.8cqw;position:relative;
}
#bitless-full-study .sec-head{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;
  margin:3.2cqw 0 2cqw;padding:0 .4cqw;
}
#bitless-full-study .sec-head h3{
  margin:0;font-size:3.9cqw;font-weight:700;color:var(--ink);letter-spacing:-.06cqw;
}
#bitless-full-study .sec-head span{
  font-size:max(11px,2.9cqw);font-weight:600;color:var(--muted-ink);
}
#bitless-full-study .info-dot{
  display:inline-grid;place-items:center;width:4cqw;height:4cqw;border-radius:50%;
  border:1.4px solid currentColor;font-size:2.3cqw;font-weight:700;opacity:.7;flex-shrink:0;font-style:normal;
}

/* Halftone Accent Utility */
#bitless-full-study .halftone-corner{
  position:absolute;right:0;top:0;width:36cqw;height:28cqw;pointer-events:none;
  background-image:radial-gradient(var(--grid-dot) 1.3px,transparent 1.3px);
  background-size:2.4cqw 2.4cqw;
  -webkit-mask-image:radial-gradient(circle at 90% 10%,#000 10%,transparent 72%);
  mask-image:radial-gradient(circle at 90% 10%,#000 10%,transparent 72%);
}

/* Home Screen */
#bitless-full-study .h-top-row{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;
  margin:0 0 2.4cqw .4cqw;
}
#bitless-full-study .h-greeting{

}
#bitless-full-study .pace-pill{
  display:inline-flex;align-items:center;gap:1.3cqw;padding:1.1cqw 2.5cqw;border-radius:999px;
  background:var(--p1-soft);color:var(--p1-ink);font-size:2.7cqw;font-weight:700;
  border:1px solid rgba(0,179,134,.22);
}
#bitless-full-study .pace-pill i{
  width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--p1);display:block;
}

/* Home Isometric Architectural Hero */
#bitless-full-study .h-hero{
  isolation:isolate;position:relative;overflow:hidden;
  border-radius:4.8cqw;padding:4.2cqw;margin-bottom:2.8cqw;
  background:var(--hero-bg);color:var(--hero-ink);
  border:1px solid var(--hero-border);
  box-shadow:0 3cqw 6cqw -2cqw rgba(10,14,23,.28);
}
#bitless-full-study .h-hero-halftone{
  position:absolute;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.2px);
  background-size:2.5cqw 2.5cqw;
  -webkit-mask-image:radial-gradient(circle at 86% 24%,#000 15%,transparent 68%);
  mask-image:radial-gradient(circle at 86% 24%,#000 15%,transparent 68%);
}
#bitless-full-study .h-iso-art{
  position:absolute;right:2.6cqw;top:8cqw;width:27cqw;height:27cqw;z-index:-1;pointer-events:none;opacity:.92;
}
#bitless-full-study .h-light{
  position:absolute;inset:-25% -70%;z-index:-1;
  background:linear-gradient(108deg,transparent 35%,rgba(34,243,186,.22) 50%,transparent 65%);
  transform:translateX(-70%);pointer-events:none;
}
#bitless-full-study .h-hero.playing .h-light{animation:heroSweep 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes heroSweep{from{transform:translateX(-70%)}to{transform:translateX(75%)}}

#bitless-full-study .h-label{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;
  font-size:3.5cqw;font-weight:700;color:var(--hero-ink);
}
#bitless-full-study .h-label>span:first-child{display:inline-flex;align-items:center;gap:1.5cqw}
#bitless-full-study .h-estimate{
  font-size:max(10px,2.3cqw);font-weight:700;letter-spacing:.08cqw;
  padding:.9cqw 2.2cqw;border-radius:999px;
  border:1px solid var(--hero-pill-border);background:var(--hero-pill-bg);color:var(--hero-pill-ink);
}
#bitless-full-study .h-scope{
  font-size:max(11px,2.8cqw);color:var(--hero-sub);font-weight:500;margin-top:.7cqw;
}
#bitless-full-study .h-date-block{
  display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw;
  margin:3cqw 0 3.2cqw;padding-right:20cqw;
}
#bitless-full-study .h-short-date{
  font-size:8.2cqw;font-weight:700;letter-spacing:-.24cqw;color:var(--hero-ink);line-height:1;
}
#bitless-full-study .h-count{
  display:flex;align-items:baseline;gap:1.4cqw;margin-top:1.4cqw;
}
#bitless-full-study .h-count strong{
  font-size:5.2cqw;font-weight:700;color:var(--hero-fill);line-height:1;
}
#bitless-full-study .h-count span{
  font-size:2.6cqw;font-weight:600;color:var(--hero-sub);
}
#bitless-full-study .h-progress{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1.4cqw;margin-bottom:2.6cqw;
}
#bitless-full-study .h-progress i{
  display:block;height:1.7cqw;border-radius:999px;background:var(--hero-track);overflow:hidden;position:relative;
}
#bitless-full-study .h-progress i.on{background:var(--hero-fill)}
#bitless-full-study .h-progress i.part{
  background:linear-gradient(90deg,var(--hero-fill) 32%,var(--hero-track) 32%);
}
#bitless-full-study .h-hero.playing .h-progress i.on,
#bitless-full-study .h-hero.playing .h-progress i.part{
  animation:segPop .45s cubic-bezier(.2,.9,.3,1) backwards;
}
#bitless-full-study .h-hero.playing .h-progress i:nth-child(2){animation-delay:.08s}
#bitless-full-study .h-hero.playing .h-progress i:nth-child(3){animation-delay:.16s}
@keyframes segPop{from{transform:scaleX(.35);opacity:.4}to{transform:scaleX(1);opacity:1}}

#bitless-full-study .h-footer{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;

  padding-top:2cqw;border-top:1px solid rgba(255,255,255,.1);
}
#bitless-full-study .h-footer button{
  background:transparent;border:0;padding:0;color:var(--hero-fill);font-weight:700;font-size:inherit;
}

/* Home Snapshot Bento Card */
#bitless-full-study .snap-head{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;margin-bottom:2.8cqw;
}
#bitless-full-study .snap-title{font-size:4cqw;font-weight:700;color:var(--ink)}

#bitless-full-study .snap-tile{
  border-radius:3cqw;padding:2.2cqw 2.8cqw;background:var(--surface-2);border:1px solid var(--line);

}

  display:flex;justify-content:center;align-items:center;gap:1.5cqw;margin-top:2.8cqw;
}
#bitless-full-study .h-pages button{
  border:0;padding:0;height:1.5cqw;border-radius:999px;background:var(--line);width:1.5cqw;transition:all .2s ease;
}
#bitless-full-study .h-pages button.on{
  width:5cqw;background:var(--p1);
}

/* Shared Row & Pill Styles */
#bitless-full-study .card-title-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:2cqw;margin-bottom:2.4cqw;
}
#bitless-full-study .card-title-row h4{
  margin:0;font-size:4cqw;font-weight:700;color:var(--ink);letter-spacing:-.05cqw;
}

  margin:.5cqw 0 0;font-size:max(11px,2.8cqw);color:var(--muted-ink);
}

}
#bitless-full-study .rank{
  width:6.8cqw;height:6.8cqw;border-radius:2.2cqw;background:var(--surface-2);border:1px solid var(--line);

}
#bitless-full-study .lead-icon{

#bitless-full-study .lead-icon.neg{background:var(--p3-soft);color:var(--p3-ink)}

#bitless-full-study .list-row{

}

#bitless-full-study .row-main{flex:1;min-width:0}
#bitless-full-study .row-main strong{

  display:block;font-size:max(11px,2.75cqw);color:var(--muted-ink);margin-top:.4cqw;
}
#bitless-full-study .date-pill{
  font-size:max(11px,2.7cqw);font-weight:700;padding:1.2cqw 2.4cqw;border-radius:2cqw;

}
#bitless-full-study .chev{color:var(--muted-ink);font-size:4cqw;font-weight:600;margin-left:.6cqw}

}
#bitless-full-study .hero-top{
  display:flex;align-items:center;justify-content:space-between;
  font-size:max(11px,3cqw);font-weight:600;color:var(--hero-sub);

#bitless-full-study .hero-big{

#bitless-full-study .hero-bottom{
  display:flex;align-items:center;justify-content:space-between;gap:2cqw;

}
#bitless-full-study .hero-chip{
  padding:1cqw 2.6cqw;border-radius:999px;font-size:max(11px,2.7cqw);font-weight:700;

  margin:1cqw 0 2.2cqw .4cqw;
}

  margin:0;font-size:3.7cqw;font-weight:700;color:var(--muted-ink);
}
#bitless-full-study .sort-btn{
  display:inline-flex;align-items:center;gap:2.6cqw;
  padding:1.8cqw 3cqw;border-radius:2.6cqw;border:1px solid var(--line);

    phone.dataset.page = page;
    modeChipLbl.textContent = design === 'carbon' ? 'Carbon' : 'Daylight';

    legPos.style.background = design === 'carbon' ? '#22F3BA' : '#00B386';
    legP2.style.background = design === 'carbon' ? '#6E8FFF' : '#2952FF';
    legNeg.style.background = design === 'carbon' ? '#FF6B78' : '#FF4D5E';

    root.querySelectorAll('[data-design]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.design === design)));
    root.querySelectorAll('[data-screen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.screen === page)));

    const isSettings = page === 'settings';
    mainChrome.hidden = isSettings;
    settingsChrome.hidden = !isSettings;
    bottomNav.hidden = isSettings;
    addFab.hidden = !meta.fab;

    brandTitle.textContent = meta.title;

    if (meta.sections) {
      sectionTabsWrap.hidden = false;
      sectionTabs.innerHTML = meta.sections.map(s =>
        `<button role="tab" data-sub="${s.id}" aria-selected="${s.id === page}">${s.label}</button>`
      ).join('');
      sectionTabs.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
        page = b.dataset.sub;
        lastNonSettings = page;
        render();
      }));
    } else {
      sectionTabsWrap.hidden = true;
      sectionTabs.innerHTML = '';
    }

    bottomNav.querySelectorAll('.nav-item').forEach(b => {
      if (b.dataset.nav === meta.nav) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    replayBtn.hidden = page !== 'home';
    content.innerHTML = (builders[page] || screenHome)();
    content.scrollTop = 0;

    content.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', () => {
      page = el.dataset.jump;
      lastNonSettings = page;
      render();
    }));

    content.querySelectorAll('[data-period]').forEach(el => el.addEventListener('click', () => {
      overviewPeriod = el.dataset.period;
      render();
    }));

    content.querySelectorAll('[data-slide]').forEach(el => el.addEventListener('click', () => {
      homeSlide = Number(el.dataset.slide);
      render();
    }));

    content.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => {
      acctCategory = el.dataset.cat;
      render();
    }));

    const sortBtn = document.getElementById('acct-sort-btn');
    if (sortBtn) {
      sortBtn.addEventListener('click', () => {
        acctSort = acctSort === 'name' ? 'balance' : 'name';
        render();
      });
    }

    content.querySelectorAll('[data-scope]').forEach(el => el.addEventListener('click', () => {
      strategyScope = el.dataset.scope;
      render();
    }));

    content.querySelectorAll('[data-method]').forEach(el => el.addEventListener('click', () => {
      strategyMethod = el.dataset.method;
      render();
    }));

    const extraDec = document.getElementById('extra-dec');
    const extraInc = document.getElementById('extra-inc');
    if (extraDec) extraDec.addEventListener('click', () => { extraMonthly = Math.max(0, extraMonthly - 250); render(); });
    if (extraInc) extraInc.addEventListener('click', () => { extraMonthly = Math.min(10000, extraMonthly + 250); render(); });

    content.querySelectorAll('[data-day]').forEach(el => el.addEventListener('click', () => {
      selectedDay = Number(el.dataset.day);
      render();
    }));

    const themeRow = document.getElementById('theme-toggle-row');
    if (themeRow) {
      themeRow.addEventListener('click', () => {
        design = design === 'daylight' ? 'carbon' : 'daylight';
        render();
      });
    }
  }

  root.querySelectorAll('[data-design]').forEach(b => b.addEventListener('click', () => {
    design = b.dataset.design;
    render();
  }));
  root.querySelectorAll('[data-screen]').forEach(b => b.addEventListener('click', () => {
    page = b.dataset.screen;
    if (page !== 'settings') lastNonSettings = page;
    render();
  }));
  root.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    page = b.dataset.nav;
    if (page !== 'settings') lastNonSettings = page;
    render();
  }));
  document.getElementById('close-settings-btn').addEventListener('click', () => {
    page = lastNonSettings || 'home';
    render();
  });
  replayBtn.addEventListener('click', () => {
    const hero = content.querySelector('.h-hero');
    if (hero) {
      hero.classList.remove('playing');
      void hero.offsetWidth;
      hero.classList.add('playing');
    }
  });

  render();
})();
</script>
</body></html>
