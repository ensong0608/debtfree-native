<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<style>
#account-studies{font-family:Arial,sans-serif;color:var(--foreground)}
#account-studies *{box-sizing:border-box}
#account-studies .design-picker{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#account-studies .design-picker button{font:500 12px Arial;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:24px;padding:11px 12px;cursor:pointer}
#account-studies .design-picker button[aria-pressed=true]{background:#0051fb;border-color:#0051fb;color:#fff}
#account-studies .stage{max-width:430px;margin:auto;container-type:inline-size}
#account-studies .phone{height:203.87cqw;background:#f5f7fc;color:#182032;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 12px 38px #070d5b14;display:flex;flex-direction:column;font-family:Arial,sans-serif;line-height:1.25}

#account-studies .brand{display:flex;align-items:center;gap:2.5cqw;font-size:6cqw;font-weight:700;letter-spacing:-.25cqw}
#account-studies .logo{display:block;width:5.9cqw;height:5.9cqw;overflow:hidden;position:relative;border-radius:1.4cqw;background:#0051fb;flex-shrink:0}
#account-studies .logo img{position:absolute;width:100cqw;max-width:none;left:-3.85cqw;top:-4.65cqw}
#account-studies .gear{color:#637083;font-size:6cqw;line-height:1;display:grid;place-items:center;width:9cqw;height:9cqw}

#account-studies .sections button[aria-selected=true]{border-bottom-color:#0051fb;color:#0051fb}
#account-studies .content{flex:1;min-height:0;overflow:hidden;padding:4cqw 4cqw 0}

#account-studies .nav img{width:100%;max-width:none;position:absolute;bottom:0;left:0}
#account-studies .fab{position:absolute;z-index:5;right:4.3cqw;bottom:19.6cqw;width:13.66cqw;height:13.66cqw;border:0;border-radius:50%;background:#0051fb;box-shadow:0 2cqw 3cqw #0003;pointer-events:none}
#account-studies .fab:before,#account-studies .fab:after{content:'';position:absolute;top:50%;left:50%;background:#fff;width:5.2cqw;height:.8cqw;border-radius:10px;transform:translate(-50%,-50%)}
#account-studies .fab:after{transform:translate(-50%,-50%) rotate(90deg)}
#account-studies [data-page=strategy] .fab{display:none}
#account-studies .hero{isolation:isolate;position:relative;overflow:hidden;padding:4cqw;border-radius:4.5cqw;background:linear-gradient(118deg,#070d5b,#0051fb);color:#fff;box-shadow:0 5px 12px #0051fb12}
#account-studies .hero:after{content:'';position:absolute;z-index:-1;border:1px solid #abdffd22;border-radius:50%;width:54cqw;height:54cqw;right:-22cqw;top:-22cqw;box-shadow:0 0 0 5cqw #abdffd07,0 0 0 10cqw #abdffd05}
#account-studies .hero-label{font-size:max(11px,3.2cqw);color:#dceaff;display:flex;align-items:center;justify-content:space-between;gap:2cqw}
#account-studies .info{font-size:max(11px,3cqw);font-weight:600;opacity:.85}
#account-studies .money{font-size:8.8cqw;letter-spacing:-.4cqw;font-weight:600;white-space:nowrap;line-height:1.15}

#account-studies .hero .money{margin:2cqw 0}
#account-studies .hero-foot{font-size:max(11px,3cqw);color:#dceaff;display:flex;align-items:center;justify-content:space-between;gap:2cqw}
#account-studies .hero-date{font-size:8.4cqw;letter-spacing:-.4cqw;font-weight:600;margin:1.8cqw 0 1.5cqw}
#account-studies .hero-scope{font-size:max(11px,2.8cqw);color:#cee3ff;margin-top:2.6cqw}

#account-studies .hero-method{font-size:max(11px,2.9cqw);background:#ffffff19;border:1px solid #ffffff16;padding:1cqw 2cqw;border-radius:20px;color:#dff7ff}

#account-studies .filters span{font-size:max(11px,3.1cqw);white-space:nowrap;border-radius:20px;padding:2.2cqw 2.5cqw;background:#fff;border:1px solid #dfe5ef;color:#39465b;font-weight:500}
#account-studies .filters span.active{background:#0051fb;color:#fff;border-color:#0051fb}
#account-studies .toolbar{display:flex;align-items:center;background:#fff;border:1px solid #dfe5ef;border-radius:3cqw;padding:2.8cqw 3.5cqw;font-size:max(11px,3.4cqw);color:#6d7787;gap:2cqw;min-height:10cqw}
#account-studies .toolbar .search{flex:1;display:flex;align-items:center;gap:2cqw}
#account-studies .search-mark{height:3.1cqw;width:3.1cqw;border-radius:50%;border:1.5px solid currentColor;position:relative;display:inline-block;flex-shrink:0}

#account-studies .section-title{font-size:4.3cqw;font-weight:600;letter-spacing:-.1cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 4cqw;margin:4cqw 0 2.5cqw}
#account-studies .section-title>span{font-size:max(11px,3cqw);font-weight:500;letter-spacing:0;color:#68758a}

#account-studies .account-main{display:flex;align-items:center;gap:2.6cqw;min-width:0}

#account-studies .account-name{flex:1;min-width:0}
#account-studies .account-name strong{display:block;font-size:4.2cqw;font-weight:600;letter-spacing:-.12cqw}

#account-studies .account-value{white-space:nowrap;font-size:4.8cqw;font-weight:600;letter-spacing:-.15cqw;text-align:right}

#account-studies .chevron{color:#8290a3;font-size:5cqw;margin-left:1cqw}
#account-studies .account-meta{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font-size:max(11px,2.8cqw);color:#68758a;margin-top:2.3cqw}
#account-studies .reduction{color:#17805a;font-weight:500;white-space:nowrap}
#account-studies .mini-track{height:1.1cqw;border-radius:8px;background:#e5eaf2;overflow:hidden;margin-top:2.8cqw}
#account-studies .mini-track i{display:block;height:100%;background:#0051fb;border-radius:8px}
#account-studies .scope-tabs{display:flex;gap:5cqw;margin:3.5cqw 4cqw 0;border:0;font-size:max(11px,3.2cqw);color:#6b778b}

#account-studies .scope-tabs .active{color:#0051fb;font-weight:600;border-bottom:2px solid #0051fb}
#account-studies .method-panel{padding:0 4cqw}
#account-studies .methods{display:flex;gap:2cqw}
#account-studies .method-option{flex:1;min-width:0;border-radius:3cqw;background:#fff;border:1px solid #dfe5ef;padding:3cqw;position:relative}

#account-studies .method-option>span{display:block;font-size:max(11px,2.8cqw);color:#66758c;margin-top:1.3cqw}

#account-studies .extra-panel{background:#fff;border:1px solid #dfe5ef;border-radius:3.5cqw;padding:3.5cqw 4cqw;margin:3cqw 4cqw 0}
#account-studies .extra-label{font-size:max(11px,3.2cqw);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:2cqw}

#account-studies .extra-field>span:last-child{font-size:max(11px,2.9cqw);color:#68758a}

#account-studies .rank{width:6cqw;height:8cqw;display:grid;place-items:center;flex-shrink:0;border-radius:2cqw;background:#f0f3f9;font-size:3.5cqw;color:#53627a}

#account-studies .payoff-date{display:block;color:#0051fb;font-size:max(11px,2.8cqw);font-weight:500;margin-top:1.4cqw;background:#edf3ff;padding:.8cqw 1.5cqw;border-radius:1.4cqw;letter-spacing:0}

#account-studies .ledger .hero .money{font-size:10cqw;font-weight:500;letter-spacing:-.5cqw;margin:2.5cqw 0}

#account-studies .ledger .account-value{font-size:4.6cqw}

#account-studies .ledger .scope-tabs{margin-top:4cqw;margin-bottom:2cqw}
#account-studies .ledger .method-panel{background:#fff;border:1px solid #e0e6ef;margin:0 4cqw;padding:0 3cqw;border-radius:3cqw}
#account-studies .ledger .methods{display:block}
#account-studies .ledger .method-option{border:0;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:3cqw 0}
